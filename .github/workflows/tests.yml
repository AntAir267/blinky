name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libusb-1.0-0
          python -m pip install --upgrade pip
          python -m pip install pyusb pillow
          # PyQt6 so the GUI tests run instead of skipping. It needs a
          # platform plugin even headless; offscreen is set by the test.
          python -m pip install PyQt6 || echo "PyQt6 unavailable; GUI tests will skip"
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 || true
      - name: Run the simulated-camera test suite
        run: python tests/test_blinky.py

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the .deb
        run: ./packaging/build-deb.sh
      - name: Verify it unpacks and runs
        run: |
          sudo apt-get update && sudo apt-get install -y python3-pil
          dpkg-deb -c packaging/blinky_*.deb
          mkdir -p /tmp/root && dpkg-deb -x packaging/blinky_*.deb /tmp/root
          # The launchers are thin wrappers around the installed modules, so
          # running them out of an unpacked tree needs the module path.
          export PYTHONPATH=/tmp/root/usr/lib/python3/dist-packages
          /tmp/root/usr/bin/blinky --version
          /tmp/root/usr/bin/blinky convert --help > /dev/null
          # blinky-gui must fail with advice, not a traceback, when PyQt6 is absent.
          if /tmp/root/usr/bin/blinky-gui 2>&1 | grep -q "needs PyQt6"; then
            echo "blinky-gui degrades cleanly without PyQt6"
          else
            echo "blinky-gui did not give the expected message" >&2; exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: blinky-deb
          path: packaging/blinky_*.deb
